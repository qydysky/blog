baseURL = ""
languageCode = "zh-CN"
title = "qydysky's blog"
theme = "maupassant"
googleAnalytics = ""  # UA-XXXXXXXX-X

## 保持分类的原始名字（false会做转小写处理）
preserveTaxonomyNames = true
## 是否禁止URL Path转小写
disablePathToLower = true

hasCJKLanguage = true
summaryLength = 140

# disqusShortname = "blogqydysky"  ## 是否开启disqus评论，不要和utteranc同时开启

[[module.mounts]]
  source = 'assets'
  target = 'assets'

[author]
  name = "qydysky"

[params]
  author = "qydysky"
  subtitle = "日常记录"
  keywords = "qydysky,blog"
  description = "qydysky's blog"
  busuanzi = false #启用不算子网页统计
  googleAd = ""  #ca-pub-xxxxxxxxxxxxxx
  localSearch = true # 启用本地搜索

  # 这里我存放在了主题的static文件夹里，根目录的似乎也可以
  customCSS = []
  # if ['custom.css'], load '/static/css/custom.css' file
  customJS = []
  # if ['custom.js'], load '/static/js/custom.js' file

  # 全局开关，你也可以在每一篇内容的 front matter 中针对单篇内容关闭或开启某些功能
  toc = false  # 是否开启目录

[permalinks]
  post = "post/:year:month:day:slug"

## 友情链接，可以多个

[[params.links]]
  title = "VCB-Studio"
  name = "VCB-Studio"
  url = "https://vcb-s.com/"

## 侧边栏广告位

## 配置 utteranc评论,教程参考 https://utteranc.es/
[params.utteranc]
  enable = false
  repo = "your github repo" ##换成自己得
  issueTerm = "pathname"
  theme = "github-light"

## 开启版权声明，协议名字和链接都可以换
[params.cc]
    name = "知识共享署名-非商业性使用-禁止演绎 4.0 国际许可协议"
    link = "https://creativecommons.org/licenses/by-nc-nd/4.0/"

## 配置代码高亮
[markup]
  [markup.highlight]
    lineNos = true
    style = "github"
  [markup.tableOfContents]
    endLevel = 5
    ordered = false
    startLevel = 1

## 配置网站菜单

[menu]

  [[menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 2

  [[menu.main]]
    identifier = "archives"
    name = "归档"
    url = "/archives/"
    weight = 3

  [[menu.main]]
    identifier = "search"
    name = "查找"
    url = "/search/"
    weight = 4

  [[menu.main]]
    identifier = "about"
    name = "关于"
    url = "/about/"
    weight = 5
